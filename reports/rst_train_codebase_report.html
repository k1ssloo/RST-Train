:root {
  --accent: #ff6b1a;
  --cyan: #38bdf8;
  --green: #22c55e;
  --yellow: #f5a623;
  --red: #ef4444;
  --dark: #000;
  --card: #080808;
  --card2: #0e0e0e;
  --border: #171717;
  --body: #999;
  --label: #666;
  --muted: #555;
  --light: #fff;
}

section {
  background: var(--dark);
  color: var(--light);
  font-family: 'Raleway', 'Noto Sans SC', sans-serif;
  font-weight: 200;
  padding: 50px 68px;
  line-height: 1.5;
}

h1 {
  font-family: 'Outfit', 'Noto Sans SC', sans-serif;
  font-weight: 800;
  font-size: 2.85em;
  color: var(--light);
  line-height: 1.05;
  margin: 0 0 8px;
}

h2 {
  font-family: 'Raleway', 'Noto Sans SC', sans-serif;
  font-weight: 100;
  font-size: 1.15em;
  color: #888;
  margin: 0 0 20px;
}

h3 {
  font-family: 'Outfit', 'Noto Sans SC', sans-serif;
  font-weight: 600;
  font-size: 0.58em;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.18em;
  margin: 0 0 6px;
}

strong { color: var(--accent); font-weight: 400; }
code { color: #ddd; background: #111; border: 1px solid #1a1a1a; border-radius: 4px; padding: 1px 5px; }
section::after { font-family: 'Outfit'; font-size: 0.58em; color: #1b1b1b; }

section.lead {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

section.lead h1 { font-size: 3.65em; }

.chips { display: flex; gap: 8px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
.chip {
  background: #ff6b1a14;
  border: 1px solid #ff6b1a33;
  border-radius: 18px;
  padding: 4px 13px;
  font-family: 'Outfit';
  font-size: 0.55em;
  color: #ffb27f;
  font-weight: 600;
  letter-spacing: 0.06em;
}

.metric-row { display: flex; gap: 14px; margin-top: 18px; }
.metric {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 18px;
  position: relative;
  overflow: hidden;
  min-height: 116px;
}
.metric::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), transparent);
}
.metric .label {
  font-family: 'Outfit';
  font-weight: 600;
  font-size: 0.48em;
  color: var(--label);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.metric .value {
  font-family: 'Outfit';
  font-weight: 800;
  font-size: 1.9em;
  line-height: 1.05;
  color: var(--light);
  margin-top: 10px;
}
.metric .note { font-size: 0.62em; color: var(--body); margin-top: 8px; }

.flow { display: flex; align-items: stretch; gap: 8px; margin-top: 18px; }
.node {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 14px;
  min-height: 118px;
}
.node .k {
  font-family: 'Outfit';
  font-size: 0.52em;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--accent);
  text-transform: uppercase;
}
.node .t { font-family: 'Outfit'; font-size: 0.95em; font-weight: 700; margin-top: 7px; }
.node .d { font-size: 0.62em; color: var(--body); margin-top: 6px; }
.arrow { width: 28px; display: flex; align-items: center; justify-content: center; color: #333; font-family: 'Outfit'; font-size: 1.2em; }

.rows { margin-top: 12px; font-size: 0.68em; }
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 8px;
  border-bottom: 1px solid #101010;
  border-radius: 6px;
}
.row:hover { background: #0c0c0c; }
.row .name { width: 210px; color: #d0d0d0; font-weight: 300; }
.row .desc { flex: 1; color: var(--body); }
.row .tag { width: 86px; text-align: center; }

.tag {
  font-family: 'Outfit';
  font-weight: 700;
  font-size: 0.55em;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 4px;
  display: inline-block;
